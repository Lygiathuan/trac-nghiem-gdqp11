            appState.mode = mode;
            appState.currentIndex = 0;
            appState.userAnswers = {};
            appState.isFinished = false;

            // Filter Questions
            let list = [...rawQuestions];
            if (appState.lessonFilter !== 'all') {
                list = list.filter(q => q.lesson === Number(appState.lessonFilter));
            }

            // Shuffle or slice for exam
            if (mode === 'exam') {
                list = list.sort(() => Math.random() - 0.5);
                list = list.slice(0, Math.min(appState.examLength, list.length));
                appState.timeLeft = list.length * 60; // 1 min per question
                startTimer();
            }

            appState.currentQuestions = list;
            renderQuizScreen();
        }

            if (appState.timer) clearInterval(appState.timer);

                const timerEl = document.getElementById('timer-display');

                    const m = Math.floor(appState.timeLeft / 60);
                    const s = appState.timeLeft % 60;
                    timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }
                if (appState.timeLeft <= 0) {
                    clearInterval(appState.timer);
                    submitQuiz();
                }
            }, 1000);

                            <h3 class="text-base sm:text-lg font-semibold text-slate-800 leading-snug">
                                ${q.q}
                            </h3>

                            <div class="space-y-3">
                                ${q.options.map((opt, idx) => {
                                    const isSelected = appState.userAnswers[q.id] === idx;
                                    const isCorrect = idx === q.correct;
                                    const showResult = appState.mode === 'practice' && appState.userAnswers[q.id] !== undefined;

                                    let btnStyle = "border-slate-200 hover:bg-slate-50 text-slate-700";
                                    let badgeStyle = "bg-slate-100 text-slate-600";

                                    if (isSelected) {
                                        btnStyle = "border-indigo-600 bg-indigo-50/50 text-indigo-900 font-medium";
                                        badgeStyle = "bg-indigo-600 text-white";
                                    }

                                    if (showResult) {
                                        if (isCorrect) {
                                            btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-900 font-semibold";
                                            badgeStyle = "bg-emerald-600 text-white";
                                        } else if (isSelected && !isCorrect) {
                                            btnStyle = "border-rose-500 bg-rose-50 text-rose-900 font-semibold";
                                            badgeStyle = "bg-rose-600 text-white";
                                        }
                                    }

                                    return `
                                        <button onclick="selectOption(${q.id}, ${idx})" class="w-full text-left p-4 rounded-xl border ${btnStyle} transition flex items-start space-x-3 group text-sm sm:text-base">
                                            <span class="w-6 h-6 rounded-lg flex items-center justify-center text-xs font-bold shrink-0 mt-0.5 ${badgeStyle}">
                                                ${String.fromCharCode(65 + idx)}
                                            </span>
                                            <span class="flex-1">${opt}</span>
                                            ${showResult && isCorrect ? `<i class="fa-solid fa-circle-check text-emerald-600 mt-1"></i>` : ''}
                                            ${showResult && isSelected && !isCorrect ? `<i class="fa-solid fa-circle-xmark text-rose-600 mt-1"></i>` : ''}
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            ${appState.mode === 'practice' && appState.userAnswers[q.id] !== undefined ? `
                                <div class="p-3.5 rounded-xl ${appState.userAnswers[q.id] === q.correct ? 'bg-emerald-50 border border-emerald-200 text-emerald-800' : 'bg-rose-50 border border-rose-200 text-rose-800'} text-xs sm:text-sm">
                                    <span class="font-bold">${appState.userAnswers[q.id] === q.correct ? 'Chính xác! 🎉' : 'Chưa đúng! ❌'}</span>
                                    ${appState.userAnswers[q.id] !== q.correct ? `Đáp án đúng là: <strong>${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</strong>` : ''}
                                </div>
                            ` : ''}
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex justify-between items-center pt-2">
                            <button onclick="prevQuestion()" ${appState.currentIndex === 0 ? 'disabled' : ''} class="px-4 py-2 bg-white border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed font-medium text-sm flex items-center gap-1.5 shadow-sm">
                                <i class="fa-solid fa-arrow-left"></i> Câu trước
                            </button>

                            ${appState.currentIndex < total - 1 ? `
                                <button onclick="nextQuestion()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-medium text-sm flex items-center gap-1.5 shadow-md shadow-indigo-200">
                                    Câu tiếp <i class="fa-solid fa-arrow-right"></i>
                                </button>
                            ` : `
                                <button onclick="confirmSubmit()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-sm flex items-center gap-1.5 shadow-md shadow-emerald-200">
                                    <i class="fa-solid fa-paper-plane"></i> Nộp Bài
                                </button>
                            `}
                        </div>
                    </div>

                    <!-- Right Sidebar: Question Palette -->
                    <div class="space-y-4">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                                <h4 class="font-bold text-slate-800 text-sm">Danh sách câu hỏi</h4>
                                <span class="text-xs text-slate-500">Đã làm: <strong>${answeredCount}/${total}</strong></span>
                            </div>

                            <!-- Grid of Numbers -->
                            <div class="grid grid-cols-5 sm:grid-cols-8 lg:grid-cols-5 gap-2 max-h-64 overflow-y-auto pr-1 custom-scrollbar">
                                ${appState.currentQuestions.map((item, i) => {
                                    const isCurrent = i === appState.currentIndex;
                                    const isAnswered = appState.userAnswers[item.id] !== undefined;
                                    let numStyle = "bg-slate-100 text-slate-600 border-transparent hover:bg-slate-200";

                                    if (isAnswered) {
                                        if (appState.mode === 'practice') {
                                            numStyle = appState.userAnswers[item.id] === item.correct ? "bg-emerald-500 text-white font-bold" : "bg-rose-500 text-white font-bold";
                                        } else {
                                            numStyle = "bg-indigo-600 text-white font-bold";
                                        }
                                    }

                                    if (isCurrent) {
                                        numStyle += " ring-2 ring-indigo-600 ring-offset-2";
                                    }

                                    return `
                                        <button onclick="goToQuestion(${i})" class="w-full h-9 rounded-lg text-xs font-medium flex items-center justify-center transition border ${numStyle}">
                                            ${i + 1}
                                        </button>
                                    `;
                                }).join('')}
                            </div>

                            <div class="pt-2">
                                <button onclick="confirmSubmit()" class="w-full py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition text-sm flex items-center justify-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-check-double"></i> Nộp Bài & Xem Điểm
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function startFreePractice() {
            appState.mode = 'practice';
            appState.lessonFilter = 'all';
            appState.currentIndex = 0;
            appState.userAnswers = {};
            appState.isFinished = false;
            if (appState.timer) clearInterval(appState.timer);

            // Full 120 questions shuffled for repeated practice
            appState.currentQuestions = [...rawQuestions].sort(() => Math.random() - 0.5);
            renderQuizScreen();
        }

        function selectOption(qId, optionIdx) {
            if (appState.isFinished) return;
            appState.userAnswers[qId] = optionIdx;
            renderQuizScreen();
        }

        function goToQuestion(idx) {
            appState.currentIndex = idx;
            renderQuizScreen();
        }

        function nextQuestion() {
            if (appState.currentIndex < appState.currentQuestions.length - 1) {
                appState.currentIndex++;
                renderQuizScreen();
            }
        }

        function prevQuestion() {
            if (appState.currentIndex > 0) {
                appState.currentIndex--;
                renderQuizScreen();
            }
        }

        function confirmSubmit() {
            const total = appState.currentQuestions.length;
            const answered = Object.keys(appState.userAnswers).length;
            if (answered < total) {
                if (!confirm(`Bạn mới trả lời ${answered}/${total} câu hỏi. Bạn có chắc chắn muốn nộp bài sớm?`)) {
                    return;
                }
            }
            submitQuiz();
        }

        function submitQuiz() {
            if (appState.timer) clearInterval(appState.timer);
            appState.isFinished = true;
            renderResultScreen();
        }

        function renderResultScreen() {
            const app = document.getElementById('app');
            const total = appState.currentQuestions.length;
            let correctCount = 0;

            appState.currentQuestions.forEach(q => {
                if (appState.userAnswers[q.id] === q.correct) {
                    correctCount++;
                }
            });

            const score = ((correctCount / total) * 10).toFixed(1);
            let evaluation = "Cần cố gắng thêm!";
            let evalColor = "text-amber-600";
            if (score >= 8.5) {
                evaluation = "Xuất sắc! Giỏi lắm! 🌟";
                evalColor = "text-emerald-600";
            } else if (score >= 7.0) {
                evaluation = "Khá tốt! Hãy duy trì phong độ! 👍";
                evalColor = "text-indigo-600";
            } else if (score >= 5.0) {
                evaluation = "Đạt yêu cầu. Hãy đọc lại kiến thức! 📚";
                evalColor = "text-blue-600";
            }

            app.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 animate-fadeIn">
                    <!-- Result Summary Card -->
                    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-md border border-slate-200 text-center space-y-4">
                        <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-3xl">
                            <i class="fa-solid fa-trophy"></i>
                        </div>

                        <div>
                            <h2 class="text-2xl font-extrabold text-slate-800">Kết Quả Bài Ôn Tập</h2>
                            <p class="text-sm ${evalColor} font-bold mt-1">${evaluation}</p>
                        </div>

                        <div class="flex justify-center items-center gap-6 py-4 border-y border-slate-100">
                            <div>
                                <div class="text-3xl font-black text-indigo-600">${score}</div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Điểm Số (Hệ 10)</div>
                            </div>
                            <div class="w-px h-10 bg-slate-200"></div>
                            <div>
                                <div class="text-3xl font-black text-emerald-600">${correctCount}/${total}</div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Số Câu Đúng</div>
                            </div>
                            <div class="w-px h-10 bg-slate-200"></div>
                            <div>
                                <div class="text-3xl font-black text-slate-700">${Math.round((correctCount/total)*100)}%</div>
                                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Tỷ Lệ Đúng</div>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-3 justify-center pt-2">
                            <button onclick="goHome()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-semibold text-sm transition">
                                <i class="fa-solid fa-house mr-1"></i> Về trang chủ
                            </button>
                            <button onclick="startQuiz('${appState.mode}')" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-semibold text-sm transition shadow-md shadow-indigo-200">
                                <i class="fa-solid fa-rotate-right mr-1"></i> Làm lại bài này
                            </button>
                        </div>
                    </div>

                    <!-- Detailed Answer Review -->
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                        <h3 class="font-bold text-slate-800 text-base pb-3 border-b border-slate-100 flex items-center justify-between">
                            <span>Chi tiết câu hỏi & Đáp án</span>
                            <span class="text-xs font-normal text-slate-500">Màu xanh: Đúng | Màu đỏ: Sai</span>
                        </h3>

                        <div class="space-y-4">
                            ${appState.currentQuestions.map((q, idx) => {
                                const uAns = appState.userAnswers[q.id];
                                const isCorrect = uAns === q.correct;

                                return `
                                    <div class="p-4 rounded-xl border ${isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'} space-y-2">
                                        <div class="flex items-start justify-between gap-2">
                                            <span class="text-xs font-bold ${isCorrect ? 'text-emerald-700 bg-emerald-100' : 'text-rose-700 bg-rose-100'} px-2 py-0.5 rounded-md">
                                                Câu ${idx + 1}
                                            </span>
                                            <span class="text-xs text-slate-400">Bài ${q.lesson}</span>
                                        </div>
                                        
                                        <p class="font-medium text-slate-800 text-sm">${q.q}</p>

                                        <div class="text-xs space-y-1 pt-1">
                                            <div>
                                                <span class="text-slate-500">Bạn chọn: </span>
                                                <span class="font-bold ${isCorrect ? 'text-emerald-700' : 'text-rose-600'}">
                                                    ${uAns !== undefined ? `${String.fromCharCode(65 + uAns)}. ${q.options[uAns]}` : 'Chưa trả lời'}
                                                </span>
                                            </div>
                                            ${!isCorrect ? `
                                                <div>
                                                    <span class="text-slate-500">Đáp án chuẩn: </span>
                                                    <span class="font-bold text-emerald-700">
                                                        ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}
                                                    </span>
                                                </div>
                                            ` : ''}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Initialize App
        window.onload = function() {
            renderHomeScreen();
        };
    </script>
</body>
</html>
