<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trắc Nghiệm GDQP-AN 11 - Mã Đề 001</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Header Header -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white/10 p-2 rounded-lg">
          <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">Ôn Thi Trắc Nghiệm GDQP - AN 11</h1>
          <p class="text-xs text-indigo-200">Trường THPT Nguyễn Khuyến - Mã đề: 001 (40 câu)</p>
        </div>
      </div>
      <div class="flex items-center space-x-3">
        <button onclick="resetQuiz()" class="text-xs sm:text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg border border-indigo-400/40 transition">
          <i class="fa-solid fa-rotate-right mr-1.5"></i>Làm lại
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

    <!-- Left / Center: Question Box -->
    <section class="lg:col-span-3 flex flex-col space-y-4">
      
      <!-- Progress Bar & Status -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col space-y-2">
        <div class="flex justify-between items-center text-sm font-semibold text-slate-600">
          <span id="current-q-index-label">Câu 1 / 40</span>
          <span id="answered-count-label" class="text-indigo-600">Đã trả lời: 0/40</span>
        </div>
        <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
          <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 2.5%"></div>
        </div>
      </div>

      <!-- Question Card -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex-1 flex flex-col justify-between">
        <div>
          <!-- Question Title -->
          <div class="flex items-start space-x-3 mb-5">
            <span id="question-badge" class="bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-md shrink-0">
              Câu 1
            </span>
            <h2 id="question-text" class="text-base sm:text-lg font-semibold text-slate-800 leading-relaxed">
              Loading...
            </h2>
          </div>

          <!-- Options List -->
          <div id="options-container" class="space-y-3">
            <!-- Options injected via JS -->
          </div>

          <!-- Explanation Box -->
          <div id="explanation-box" class="hidden mt-5 p-4 rounded-lg bg-slate-50 border border-slate-200 text-sm text-slate-700">
            <div class="font-bold text-indigo-700 mb-1 flex items-center">
              <i class="fa-solid fa-lightbulb mr-2 text-amber-500"></i>Giải thích đáp án:
            </div>
            <p id="explanation-text" class="leading-relaxed"></p>
          </div>
        </div>

        <!-- Navigation Action Buttons -->
        <div class="mt-8 pt-4 border-t border-slate-100 flex justify-between items-center">
          <button id="btn-prev" onclick="prevQuestion()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed">
            <i class="fa-solid fa-arrow-left mr-2"></i>Câu trước
          </button>
          
          <div class="space-x-2">
            <button id="btn-check" onclick="checkCurrentAnswer()" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-medium rounded-lg transition shadow-sm">
              <i class="fa-solid fa-check mr-1.5"></i>Kiểm tra
            </button>
            <button id="btn-next" onclick="nextQuestion()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition shadow-sm">
              Câu sau<i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Question Palette & Final Submit -->
    <aside class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
      <div>
        <h3 class="font-bold text-slate-800 text-base mb-3 flex items-center justify-between">
          <span>Danh sách câu hỏi</span>
          <i class="fa-solid fa-list-check text-slate-400"></i>
        </h3>
        
        <div id="question-grid" class="grid grid-cols-5 gap-2 max-h-[380px] overflow-y-auto p-1">
          <!-- 40 Question status buttons -->
        </div>

        <!-- Legend -->
        <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 space-y-2">
          <div class="flex items-center space-x-2">
            <span class="w-3.5 h-3.5 rounded border border-slate-300 bg-slate-100"></span>
            <span>Chưa làm</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-3.5 h-3.5 rounded bg-indigo-600"></span>
            <span>Đã chọn đáp án</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-3.5 h-3.5 rounded bg-emerald-500"></span>
            <span>Đúng</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="w-3.5 h-3.5 rounded bg-rose-500"></span>
            <span>Sai</span>
          </div>
        </div>
      </div>

      <button onclick="submitQuiz()" class="w-full mt-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Nộp Bài Thi</span>
      </button>
    </aside>

  </main>

  <!-- Modal Kết Quả -->
  <div id="result-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 text-center space-y-5 animate-in fade-in zoom-in duration-200">
      <div class="w-16 h-16 mx-auto rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-3xl">
        <i class="fa-solid fa-trophy"></i>
      </div>
      <div>
        <h3 class="text-2xl font-bold text-slate-800">Kết Quả Bài Làm</h3>
        <p class="text-sm text-slate-500 mt-1">Đề kiểm tra GDQP-AN 11 - Mã 001</p>
      </div>

      <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 grid grid-cols-2 gap-4">
        <div>
          <div class="text-xs text-slate-500 uppercase font-bold tracking-wider">Điểm số</div>
          <div id="modal-score" class="text-3xl font-extrabold text-indigo-600 mt-1">0/10</div>
        </div>
        <div>
          <div class="text-xs text-slate-500 uppercase font-bold tracking-wider">Số câu đúng</div>
          <div id="modal-correct-count" class="text-3xl font-extrabold text-emerald-600 mt-1">0/40</div>
        </div>
      </div>

      <div id="modal-feedback" class="text-sm font-medium text-slate-700 px-2"></div>

      <div class="flex space-x-3 pt-2">
        <button onclick="closeModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition">
          Xem Lại Bài
        </button>
        <button onclick="resetQuiz(); closeModal();" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition shadow-md">
          Làm Lại Lần Nữa
        </button>
      </div>
    </div>
  </div>

  <script>
    const questions = [
      { id: 1, q: "Khi đủ 17 tuổi trở lên đối tượng nào phải đăng ký nghĩa vụ quân sự?", options: ["A. Công dân nam.", "B. Công dân nữ.", "C. Các ý đều sai.", "D. Các ý đều đúng."], ans: 0, exp: "Theo Khoản 1 Điều 12 Luật NVQS 2015, công dân nam đủ 17 tuổi trở lên thuộc đối tượng phải đăng ký nghĩa vụ quân sự." },
      { id: 2, q: "Độ tuổi nào được qui định phải gọi nhập ngũ?", options: ["A. Đủ 17 tuổi hết 25 tuổi.", "B. Đủ 18 tuổi hết 28 tuổi.", "C. Đủ 18 tuổi hết 25 tuổi.", "D. Đủ 19 tuổi hết 25 tuổi."], ans: 2, exp: "Độ tuổi gọi nhập ngũ thông thường là từ đủ 18 tuổi đến hết 25 tuổi (trường hợp học ĐH/CĐ được hoãn thì gọi đến hết 27 tuổi)." },
      { id: 3, q: "Công dân nam đủ 17 tuổi không đăng ký Nghĩa vụ quân sự lần đầu thuộc diện phải đăng ký nghĩa vụ quân sự thì bị phạt?", options: ["A. Cảnh cáo.", "B. 11 triệu đến 13 triệu.", "C. 14 triệu đến 16 triệu.", "D. 17 triệu đến 20 triệu."], ans: 0, exp: "Căn cứ Nghị định 120/2013/NĐ-CP, vi phạm quy định về đăng ký NVQS lần đầu đối với nam đủ 17 tuổi áp dụng hình thức phạt cảnh cáo." },
      { id: 4, q: "Không có mặt đúng thời gian hoặc địa điểm khám sức khỏe ghi trong quyết định gọi khám sức khỏe NVQS cấp có thẩm quyền mà không có lý do chính đáng thì bị phạt?", options: ["A. 11 triệu đến 14 triệu.", "B. 15 triệu đến 17 triệu.", "C. 17 triệu đến 19 triệu.", "D. 15 triệu đến 20 triệu."], ans: 0, exp: "Phạt tiền từ 11.000.000 đồng đến 14.000.000 đồng đối với hành vi không có mặt đúng thời gian hoặc địa điểm khám sức khỏe." },
      { id: 5, q: "Nội dung nào sau đây quy định đối với học sinh?", options: ["A. Chấp hành nghiêm lệnh gọi nhập ngũ.", "B. Tham gia nghĩa vụ công an nhân dân.", "C. Học tập tốt môn Giáo dục quốc phòng và an ninh.", "D. Các ý đều đúng."], ans: 2, exp: "Học sinh đang ngồi trên ghế nhà trường có trách nhiệm học tập tốt môn Giáo dục quốc phòng và an ninh." },
      { id: 6, q: "Học sinh đang học một khóa học tại trường THPT thuộc đối tượng nào sau đây?", options: ["A. Tạm hoãn gọi nhập ngũ.", "B. Miễn gọi nhập ngũ.", "C. Các ý đều sai.", "D. Các ý đều đúng."], ans: 0, exp: "Theo Điểm g Khoản 1 Điều 41 Luật NVQS 2015, công dân đang học tại cơ sở giáo dục phổ thông thuộc diện tạm hoãn gọi nhập ngũ." },
      { id: 7, q: "Luật Nghĩa vụ quân sự 2015 bao gồm mấy chương, mấy điều?", options: ["A. 11 chương, 71 điều.", "B. 8 chương, 61 điều.", "C. 10 chương, 70 điều.", "D. 9 chương, 62 điều."], ans: 3, exp: "Luật Nghĩa vụ quân sự số 78/2015/QH13 gồm 9 chương và 62 điều." },
      { id: 8, q: "Tội phạm là hành vi nguy hiểm cho xã hội được quy định?", options: ["A. Trong Bộ luật Hình sự", "B. Trong Bộ luật Dân sự", "C. Trong Bộ luật Lao động", "D. Trong Bộ luật Tố tụng Dân sự"], ans: 0, exp: "Khái niệm Tội phạm và các mức độ nguy hiểm được quy định tại Bộ luật Hình sự." },
      { id: 9, q: "Tội phạm nào sau đây ở mức độ nguy hiểm nhất cho xã hội?", options: ["A. Trộm cắp", "B. Giết người", "C. Đánh bạc", "D. Đua xe"], ans: 1, exp: "Tội giết người tước đoạt quyền sống của con người, thuộc nhóm tội đặc biệt nghiêm trọng." },
      { id: 10, q: "Tội phạm công nghệ cao thường hoạt động ở đâu?", options: ["A. Trên không gian mạng", "B. Thực hiện cướp trực tiếp tài sản của người dân", "C. Các ý đều sai", "D. Các ý đều đúng"], ans: 0, exp: "Tội phạm công nghệ cao sử dụng mạng máy tính, mạng viễn thông để thực hiện hành vi vi phạm trên không gian mạng." },
      { id: 11, q: "Em hiểu thế nào về tệ nạn cờ bạc?", options: ["A. Biểu hiện thái quá lòng tin mù quáng vào những trò chơi", "B. Cá cược, sát phạt nhau bằng tiền", "C. Các ý đều sai", "D. Các ý đều đúng"], ans: 1, exp: "Tệ nạn cờ bạc là hành vi đánh bạc trái phép dưới mọi hình thức sát phạt được thua bằng tiền hoặc tài sản." },
      { id: 12, q: "Tội phạm giết người được áp dụng trong bộ luật nào sau đây?", options: ["A. Trong Bộ luật Dân sự", "B. Trong Bộ luật Hình sự", "C. Trong Bộ luật Lao động", "D. Trong Bộ luật Tố tụng Dân sự"], ans: 1, exp: "Tội giết người là tội phạm hình sự nguy hiểm được quy định tại Điều 123 Bộ luật Hình sự." },
      { id: 13, q: "Các đối tượng phạm tội có mục đích nào khi sử dụng không gian mạng đăng thông tin độc hại?", options: ["A. Tăng thêm tính đoàn kết cộng đồng.", "B. Ngăn chặn, làm giảm tội phạm.", "C. Xúi giục, lôi kéo, kích động người khác phạm tội.", "D. Kích thích kinh tế phát triển."], ans: 2, exp: "Đăng thông tin độc hại nhằm xúi giục, kích động, lôi kéo người khác phạm tội và chống phá an ninh trật tự." },
      { id: 14, q: "Pháp luật nghiêm cấm hành vi nào dưới đây?", options: ["A. Khuyến khích trẻ em tham gia vào các hoạt động vui chơi lành mạnh.", "B. Tích cực tuyên truyền về những tác hại của ma tuý.", "C. Lôi kéo người khác tham gia đánh bạc, sử dụng trái phép ma tuý.", "D. Triệt phá cây thuốc phiện."], ans: 2, exp: "Lôi kéo, rủ rê người khác đánh bạc hoặc sử dụng ma túy là hành vi nguy hiểm bị pháp luật nghiêm cấm." },
      { id: 15, q: "Là học sinh khi phát hiện những hành vi vi phạm chủ quyền lãnh thổ, BGQG cần phải làm gì?", options: ["A. Tự ý xử lý khi không đủ khả năng ngăn chặn.", "B. Báo cáo kịp thời với nhà trường, chính quyền địa phương, lực lượng chức năng.", "C. Tiếp tay cho tội phạm chống phá vùng biên giới.", "D. Xem như không thấy gì làm ngơ."], ans: 1, exp: "Học sinh cần chủ động báo cáo cho nhà trường hoặc cơ quan chức năng gần nhất." },
      { id: 16, q: "“Các Vua Hùng đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước” là câu nói của:", options: ["A. Võ Nguyên Giáp.", "B. Lý Tự Trọng.", "C. Trần Phú.", "D. Bác Hồ."], ans: 3, exp: "Đây là câu nói nổi tiếng của Bác Hồ với cán bộ chiến sĩ tại Đền Hùng ngày 19/9/1954." },
      { id: 17, q: "Những ai có trách nhiệm bảo vệ chủ quyền lãnh thổ, biên giới quốc gia nước CHXHCNVN?", options: ["A. Công an, Dân quân tự vệ.", "B. Quân đội.", "C. Toàn dân.", "D. Đảng, Nhà nước."], ans: 2, exp: "Bảo vệ Tổ quốc và chủ quyền biên giới quốc gia là nghĩa vụ thiêng liêng của toàn dân." },
      { id: 18, q: "Biên giới quốc gia trên biển được xác định như thế nào?", options: ["A. Dùng phao đánh dấu.", "B. Căng dây.", "C. Các tọa độ trên hải đồ.", "D. Cắm cột làm dấu."], ans: 2, exp: "Biên giới quốc gia trên biển được hoạch định bằng các tọa độ chuẩn trên hải đồ." },
      { id: 19, q: "Vùng biển quốc tế được hiểu như thế nào?", options: ["A. Thuộc chủ quyền của một quốc gia.", "B. Là vùng biển của một số quốc gia nhất định.", "C. Là vùng biển các nước tự do qua lại.", "D. Các ý vừa nêu đều sai."], ans: 2, exp: "Vùng biển quốc tế nằm ngoài vùng biển chủ quyền của các nước, các quốc gia được tự do hàng hải." },
      { id: 20, q: "Đối tượng nào được xem như hoàn thành nghĩa vụ quân sự?", options: ["A. Công dân phục vụ trong cảnh sát biển.", "B. Công dân phục vụ trong công an nhân dân.", "C. Công dân phục vụ trong dân quân thường trực.", "D. Các ý đều đúng."], ans: 3, exp: "Căn cứ Khoản 4 Điều 4 Luật NVQS 2015, phục vụ đủ thời hạn trong CAND, CSB hay Dân quân thường trực đều được xem như hoàn thành NVQS." },
      { id: 21, q: "Tội trộm cắp tài sản ở mức độ nhẹ xử lý thế nào?", options: ["A. Phạt tù giam giữ", "B. Phạt hành chính", "C. Không xử phạt", "D. Nhắc nhở, cảnh cáo"], ans: 1, exp: "Trộm cắp tài sản giá trị nhỏ chưa đủ yếu tố cấu thành tội phạm hình sự thì bị phạt xử lý hành chính." },
      { id: 22, q: "Đối tượng nào dưới đây được miễn đăng ký nghĩa vụ quân sự?", options: ["A. Người xăm hình.", "B. Người có anh, chị, em ruột đang thực hiện nghĩa vụ quân sự.", "C. Người có hoàn cảnh gia đình khó khăn.", "D. Người mắc bệnh hiểm nghèo; người mắc bệnh tâm thần hoặc bệnh mãn tính pháp luật quy định."], ans: 3, exp: "Theo Điều 14 Luật NVQS 2015, người mắc bệnh hiểm nghèo, tâm thần hoặc bệnh mãn tính thuộc diện miễn đăng ký NVQS." },
      { id: 23, q: "Trong thời gian bao nhiêu ngày công dân phải đăng ký NVQS khi thay đổi nơi cư trú?", options: ["A. 10 ngày.", "B. 15 ngày.", "C. 20 ngày.", "D. 30 ngày."], ans: 1, exp: "Trong thời hạn 15 ngày làm việc, công dân di chuyển nơi cư trú phải làm thủ tục đăng ký chuyển NVQS." },
      { id: 24, q: "Theo Luật Biên giới QG năm 2003, hành vi nào sau đây bị nghiêm cấm ở khu vực biên giới?", options: ["A. Phá hoại an ninh, trật tự, an toàn xã hội.", "B. Xâm phạm tài nguyên thiên nhiên.", "C. Các ý đều đúng.", "D. Bay vào khu vực cấm bay."], ans: 2, exp: "Tất cả các hành vi gây hại an ninh, tài nguyên, hay vi phạm vùng trời đều bị nghiêm cấm." },
      { id: 25, q: "Hoàn thành tham gia liên tục 36 tháng trở lên đối tượng nào được xem hoàn thành NVQS?", options: ["A. Quân đội.", "B. Dân quân tự vệ.", "C. Công an.", "D. Viên chức quốc phòng."], ans: 1, exp: "Dân quân tự vệ nòng cốt hoàn thành nghĩa vụ liên tục từ 36 tháng trở lên được công nhận hoàn thành NVQS." },
      { id: 26, q: "Chia sẻ những thông tin có kiểm duyệt trên không gian mạng có vi phạm Luật ANM không?", options: ["A. Có vi phạm Luật ANM.", "B. Không vi phạm Luật ANM.", "C. Các ý đều đúng.", "D. Các ý đều sai."], ans: 1, exp: "Thông tin đã qua kiểm duyệt và chính thống hoàn toàn không vi phạm Luật An ninh mạng." },
      { id: 27, q: "Đâu không phải là cách thức hoạt động phổ biến của các loại tội phạm, TNXH ở Việt Nam:", options: ["A. Hoạt động cố định tại một khu vực.", "B. Sử dụng vũ khí, công cụ, phương tiện trong hoạt động.", "C. Cấu kết thành các băng nhóm, tổ chức để hoạt động.", "D. Sử dụng công nghệ cao trong quá trình hoạt động phạm tội."], ans: 0, exp: "Tội phạm thường biến động địa bàn, không hoạt động duy nhất và cố định một chỗ để lẩn tránh lực lượng chức năng." },
      { id: 28, q: "Vùng lãnh hải của Việt Nam rộng bao nhiêu hải lý?", options: ["A. 12 hải lý.", "B. 188 hải lý.", "C. 338 hải lý.", "D. 24 hải lý."], ans: 0, exp: "Lãnh hải nước Việt Nam rộng 12 hải lý tính từ đường cơ sở ra phía biển." },
      { id: 29, q: "Nội dung nào sau đây phản ánh đúng mục tiêu của Đảng về Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới?", options: ["A. Phát huy cao nhất sức mạnh của dân tộc kết hợp với sức mạnh của thời đại.", "B. Bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc.", "C. Quán triệt đường lối độc lập, tự chủ; đồng thời chủ động tích cực hội nhập quốc tế.", "D. Luôn nhất quán và kiên định mục tiêu độc lập dân tộc gắn liền với chủ nghĩa xã hội."], ans: 1, exp: "Mục tiêu trọng yếu hàng đầu là bảo vệ vững chắc độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ." },
      { id: 30, q: "Nội dung nào sau đây không phản ánh đúng quan điểm chỉ đạo của Đảng về Chiến lược bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa trong tình hình mới?", options: ["A. Giữ vững sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của Đảng.", "B. Giữ vững môi trường hòa bình, ổn định để phát triển kinh tế - xã hội.", "C. Chỉ chú trọng xây dựng sức mạnh của đất nước về văn hóa - xã hội.", "D. Kết hợp chặt chẽ hai nhiệm vụ chiến lược xây dựng và bảo vệ Tổ quốc."], ans: 2, exp: "Quan điểm của Đảng là phát triển toàn diện kinh tế, chính trị, quốc phòng, an ninh, đối ngoại chứ không 'chỉ chú trọng' riêng một mặt." },
      { id: 31, q: "Bất kỳ thế lực nào có âm mưu và hành động chống phá mục tiêu của Việt Nam trong sự nghiệp xây dựng và bảo vệ Tổ quốc đều là", options: ["A. Đối tác.", "B. Đối tượng.", "C. Đồng đội.", "D. Đồng minh."], ans: 1, exp: "Những thế lực có âm mưu và hành động chống phá mục tiêu của ta đều là 'đối tượng' đấu tranh." },
      { id: 32, q: "Theo quy định trong Luật Biển Việt Nam năm 2012: vùng biển quốc tế là tất cả các vùng biển nằm ngoài vùng đặc quyền kinh tế của Việt Nam và các quốc gia khác, nhưng không bao gồm", options: ["A. Vùng nội thủy và tiếp giáp lãnh hải.", "B. Lãnh hải và vùng tiếp giáp lãnh hải.", "C. Thềm lục địa và lòng đất dưới đáy biển.", "D. Vùng đặc quyền kinh tế."], ans: 2, exp: "Vùng biển quốc tế không bao gồm đáy biển và lòng đất dưới đáy biển." },
      { id: 33, q: "Lãnh hải là vùng biển có chiều rộng 12 hải lý tính từ", options: ["A. Vùng nội thủy ra phía biển.", "B. Đường cơ sở ra phía biển.", "C. Ranh giới ngoài của lãnh hải.", "D. Ranh giới ngoài thềm lục địa."], ans: 1, exp: "Chiều rộng 12 hải lý của lãnh hải được tính từ đường cơ sở ra phía biển." },
      { id: 34, q: "Việt Nam có hai quần đảo xa bờ là", options: ["A. Hoàng Sa và Thổ Chu.", "B. Hoàng Sa và Trường Sa.", "C. Trường Sa và Phú Quý.", "D. Thổ Chu và Phú Quý."], ans: 1, exp: "Hai quần đảo xa bờ thuộc chủ quyền Việt Nam là Hoàng Sa và Trường Sa." },
      { id: 35, q: "Hành vi nào dưới đây bị nghiêm cấm trong bảo vệ biên giới quốc gia của Việt Nam?", options: ["A. Phá hoại an ninh, trật tự, an toàn xã hội ở khu vực biên giới.", "B. Bảo vệ môi trường, tài nguyên thiên nhiên và lợi ích quốc gia.", "C. Vận chuyển qua biên giới hàng hóa mà nhà nước không cấm.", "D. Tố giác những hành vi gây hư hại, làm xê dịch mốc quốc giới."], ans: 0, exp: "Phá hoại an ninh trật tự là hành vi vi phạm nghiêm trọng bị nghiêm cấm tại biên giới." },
      { id: 36, q: "Người nào có chức trách quyết định về độ tuổi tuyển chọn và ngành nghề cần thiết để tuyển chọn công dân nữ thực hiện nghĩa vụ tham gia Công an nhân dân?", options: ["A. Bộ trưởng Bộ Quốc phòng.", "B. Bộ trưởng Bộ Công an.", "C. Thủ tướng Chính phủ.", "D. Chủ tịch nước."], ans: 1, exp: "Bộ trưởng Bộ Công an có thẩm quyền quy định cụ thể đối với nữ công dân tham gia nghĩa vụ Công an nhân dân." },
      { id: 37, q: "Tệ nạn ma túy là các hành vi", options: ["A. Sử dụng trái phép chất ma tuý, nghiện ma tuý, vi phạm pháp luật về ma tuý.", "B. Mua dâm, bán dâm và các hành vi khác có liên quan đến mua dâm, bán dâm.", "C. Tin vào những điều mơ hồ dẫn đến cuồng tín, hành động trái với chuẩn mực xã hội.", "D. Lợi dụng trò chơi để cá cược, sát phạt được thua bằng tiền hoặc lợi ích vật chất khác."], ans: 0, exp: "Tệ nạn ma túy bao gồm tàng trữ, sử dụng trái phép chất ma túy và vi phạm pháp luật về ma túy." },
      { id: 38, q: "Tệ nạn mê tín dị đoan là các hành vi", options: ["A. Sử dụng trái phép chất ma tuý, nghiện ma tuý, vi phạm pháp luật về ma tuý.", "B. Mua dâm, bán dâm và các hành vi khác có liên quan đến mua dâm, bán dâm.", "C. Tin vào những điều mơ hồ dẫn đến cuồng tín, hành động trái với chuẩn mực xã hội.", "D. Lợi dụng trò chơi để cá cược, sát phạt được thua bằng tiền hoặc lợi ích vật chất khác."], ans: 2, exp: "Mê tín dị đoan là tin vào những điều hoang đường, cuồng tín trái chuẩn mực văn hóa." },
      { id: 39, q: "Câu ca dao “Thầy đề cho số tào lao/ Thầy bói nói dựa, chỗ nào cũng ma” phản ánh về loại tệ nạn xã hội nào dưới đây?", options: ["A. Tệ nạn ma túy.", "B. Tệ nạn cờ bạc.", "C. Tệ nạn mại dâm.", "D. Tệ nạn mê tín dị đoan."], ans: 3, exp: "Câu ca dao châm biếm bói toán, đồng bóng thuộc tệ nạn mê tín dị đoan." },
      { id: 40, q: "Câu tục ngữ nào sau đây phản ánh về tệ nạn cờ bạc?", options: ["A. Đánh đề ra đê mà ở.", "B. Bói ra ma, quét nhà ra rác.", "C. Đi guốc đau tay, đi cày mỏi gối.", "D. Nhịn đói nằm co hơn ăn no vác nặng."], ans: 0, exp: "'Đánh đề' là hình thức cá cược, cờ bạc dẫn đến tán gia bại sản." }
    ];

    let currentIndex = 0;
    let userAnswers = new Array(questions.length).fill(null);
    let checkedStatus = new Array(questions.length).fill(false);

    window.onload = function() {
      renderPalette();
      loadQuestion(0);
    };

    function renderPalette() {
      const grid = document.getElementById('question-grid');
      grid.innerHTML = '';
      questions.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.id = `palette-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.onclick = () => jumpToQuestion(idx);
        btn.className = getPaletteBtnClass(idx);
        grid.appendChild(btn);
      });
    }

    function getPaletteBtnClass(idx) {
      let base = "w-full h-8 rounded-lg text-xs font-bold transition flex items-center justify-center border ";
      if (idx === currentIndex) {
        base += "ring-2 ring-indigo-600 ring-offset-1 ";
      }

      if (checkedStatus[idx]) {
        if (userAnswers[idx] === questions[idx].ans) {
          return base + "bg-emerald-500 text-white border-emerald-600";
        } else {
          return base + "bg-rose-500 text-white border-rose-600";
        }
      }

      if (userAnswers[idx] !== null) {
        return base + "bg-indigo-600 text-white border-indigo-700";
      }

      return base + "bg-slate-100 text-slate-700 border-slate-200 hover:bg-slate-200";
    }

    function updatePalette() {
      questions.forEach((_, idx) => {
        const btn = document.getElementById(`palette-btn-${idx}`);
        if (btn) btn.className = getPaletteBtnClass(idx);
      });
    }

    function loadQuestion(index) {
      currentIndex = index;
      const qData = questions[index];

      document.getElementById('current-q-index-label').innerText = `Câu ${index + 1} / ${questions.length}`;
      document.getElementById('question-badge').innerText = `Câu ${index + 1}`;
      document.getElementById('question-text').innerText = qData.q;

      // Update progress
      const answeredCount = userAnswers.filter(a => a !== null).length;
      document.getElementById('answered-count-label').innerText = `Đã trả lời: ${answeredCount}/${questions.length}`;
      document.getElementById('progress-bar').style.width = `${((index + 1) / questions.length) * 100}%`;

      // Render Options
      const optionsContainer = document.getElementById('options-container');
      optionsContainer.innerHTML = '';

      qData.options.forEach((optText, optIdx) => {
        const isSelected = userAnswers[index] === optIdx;
        const isChecked = checkedStatus[index];
        const isCorrect = qData.ans === optIdx;

        let cardStyle = "border-slate-200 bg-white hover:border-indigo-300 hover:bg-slate-50";
        let iconMarkup = `<div class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center shrink-0 mr-3"><span class="w-2 h-2 rounded-full bg-transparent"></span></div>`;

        if (isSelected) {
          cardStyle = "border-indigo-600 bg-indigo-50/50 text-indigo-950 font-medium";
          iconMarkup = `<div class="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center shrink-0 mr-3 text-xs"><i class="fa-solid fa-check"></i></div>`;
        }

        if (isChecked) {
          if (isCorrect) {
            cardStyle = "border-emerald-500 bg-emerald-50 text-emerald-950 font-medium";
            iconMarkup = `<div class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0 mr-3 text-xs"><i class="fa-solid fa-check"></i></div>`;
          } else if (isSelected && !isCorrect) {
            cardStyle = "border-rose-500 bg-rose-50 text-rose-950 font-medium";
            iconMarkup = `<div class="w-5 h-5 rounded-full bg-rose-500 text-white flex items-center justify-center shrink-0 mr-3 text-xs"><i class="fa-solid fa-xmark"></i></div>`;
          }
        }

        const optDiv = document.createElement('div');
        optDiv.className = `p-3.5 rounded-xl border cursor-pointer transition flex items-center ${cardStyle}`;
        optDiv.onclick = () => selectOption(optIdx);
        optDiv.innerHTML = `${iconMarkup}<span class="text-sm leading-snug">${optText}</span>`;

        optionsContainer.appendChild(optDiv);
      });

      // Explanation Box
      const expBox = document.getElementById('explanation-box');
      if (checkedStatus[index]) {
        expBox.classList.remove('hidden');
        document.getElementById('explanation-text').innerText = qData.exp;
      } else {
        expBox.classList.add('hidden');
      }

      // Buttons Control
      document.getElementById('btn-prev').disabled = (index === 0);
      document.getElementById('btn-next').disabled = (index === questions.length - 1);

      updatePalette();
    }

    function selectOption(optIdx) {
      userAnswers[currentIndex] = optIdx;
      loadQuestion(currentIndex);
    }

    function checkCurrentAnswer() {
      if (userAnswers[currentIndex] === null) {
        alert("Vui lòng chọn một đáp án trước khi kiểm tra!");
        return;
      }
      checkedStatus[currentIndex] = true;
      loadQuestion(currentIndex);
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) {
        loadQuestion(currentIndex + 1);
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        loadQuestion(currentIndex - 1);
      }
    }

    function jumpToQuestion(index) {
      loadQuestion(index);
    }

    function submitQuiz() {
      const answeredCount = userAnswers.filter(a => a !== null).length;
      if (answeredCount < questions.length) {
        if (!confirm(`Bạn mới trả lời ${answeredCount}/${questions.length} câu hỏi. Bạn có chắc chắn muốn nộp bài?`)) {
          return;
        }
      }

      // Mark all as checked to show colors
      checkedStatus.fill(true);
      
      let correctCount = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans === questions[idx].ans) correctCount++;
      });

      const score = ((correctCount / questions.length) * 10).toFixed(1);

      document.getElementById('modal-score').innerText = `${score}/10`;
      document.getElementById('modal-correct-count').innerText = `${correctCount}/${questions.length}`;

      let feedback = "";
      if (score >= 8.5) feedback = "🎉 Xuất sắc! Bạn nắm rất vững kiến thức GDQP-AN!";
      else if (score >= 6.5) feedback = "👍 Khá tốt! Hãy ôn kỹ lại các câu làm sai nhé.";
      else if (score >= 5.0) feedback = "😊 Đạt yêu cầu. Hãy cố gắng ôn tập thêm!";
      else feedback = "📚 Bạn cần đọc kỹ lại kiến thức và làm lại bài thi thử nhé.";

      document.getElementById('modal-feedback').innerText = feedback;
      document.getElementById('result-modal').classList.remove('hidden');

      loadQuestion(currentIndex);
    }

    function resetQuiz() {
      userAnswers = new Array(questions.length).fill(null);
      checkedStatus = new Array(questions.length).fill(false);
      currentIndex = 0;
      renderPalette();
      loadQuestion(0);
    }

    function closeModal() {
      document.getElementById('result-modal').classList.add('hidden');
    }
  </script>
